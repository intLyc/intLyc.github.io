name: Analyze visitors
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Query GoatCounter API
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          token = os.environ["GOATCOUNTER_TOKEN"]
          base = "https://intlyc.goatcounter.com/api/v0"

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return {"HTTP_ERROR": e.code, "body": e.read().decode("utf-8", "replace")[:300]}

          print("=== stats/total ===")
          print(json.dumps(get(base + "/stats/total"), indent=1)[:1500])
          print("=== locations 1 day ===")
          print(json.dumps(get(base + "/stats/locations?limit=100&start=-1d"), indent=1)[:1500])
          print("=== locations 7 days ===")
          print(json.dumps(get(base + "/stats/locations?limit=100&start=-7d"), indent=1)[:1500])
          print("=== locations 30 days ===")
          print(json.dumps(get(base + "/stats/locations?limit=100&start=-30d"), indent=1)[:1500])
          print("=== top pages 30d ===")
          print(json.dumps(get(base + "/stats/pages?limit=25&start=-30d"), indent=1)[:2500])
          print("=== top refs 30d ===")
          print(json.dumps(get(base + "/stats/refs?limit=25&start=-30d"), indent=1)[:2500])
          EOF
