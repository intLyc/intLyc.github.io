name: Analyze visitors
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Query GoatCounter API
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          token = os.environ["GOATCOUNTER_TOKEN"]
          base = "https://intlyc.goatcounter.com/api/v0"

          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  return {"HTTP_ERROR": e.code, "body": e.read().decode("utf-8", "replace")[:300]}

          print("=== stats/total ===")
          print(json.dumps(get(base + "/stats/total"), indent=1)[:1500])
          print("=== locations all (2026-08-01..2026-08-09) ===")
          print(json.dumps(get(base + "/stats/locations?limit=100&start=2026-08-01&end=2026-08-09"), indent=1)[:2000])
          print("=== locations per-day 08-02..08-09 ===")
          for d in ["2026-08-02", "2026-08-03", "2026-08-04", "2026-08-05", "2026-08-06", "2026-08-07", "2026-08-08", "2026-08-09"]:
              r = get(f"{base}/stats/locations?limit=100&start={d}&end={d}")
              print(f"--- {d}: {json.dumps(r)[:400]}")
          print("=== top pages ===")
          print(json.dumps(get(base + "/stats/pages?limit=50&start=2026-08-01&end=2026-08-09"), indent=1)[:2500])
          print("=== top refs ===")
          print(json.dumps(get(base + "/stats/refs?limit=50&start=2026-08-01&end=2026-08-09"), indent=1)[:2500])
          print("=== browsers ===")
          print(json.dumps(get(base + "/stats/browsers?limit=50&start=2026-08-01&end=2026-08-09"), indent=1)[:2000])
          print("=== hits (recent) ===")
          print(json.dumps(get(base + "/hits?limit=50"), indent=1)[:3000])
          EOF
