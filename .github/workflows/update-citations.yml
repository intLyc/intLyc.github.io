name: Update citations

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "_bibliography/**"
      - "bin/update_scholar_citations.py"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies 📦
        run: pip install scholarly pyyaml

      - name: Update citations 🔄
        run: python bin/update_scholar_citations.py

      - name: Commit changes 💾
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Google Scholar citations"
            git push
          fi
