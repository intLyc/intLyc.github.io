name: Update citations

on:
  # Manual trigger only. Google Scholar blocks GitHub CI IPs, so scheduled
  # runs would always fail with "Cannot Fetch from Google Scholar".
  # Use the local launchd job (bin/refresh_local.sh) for automatic updates.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies 📦
        run: pip install scholarly pyyaml

      - name: Update citations 🔄
        run: python bin/update_scholar_citations.py

      - name: Commit changes 💾
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/citations.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Google Scholar citations"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy 🚀
        # GITHUB_TOKEN pushes do not trigger other workflows, so dispatch the
        # deploy explicitly when the data changed.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --repo intLyc/intLyc.github.io --ref main
