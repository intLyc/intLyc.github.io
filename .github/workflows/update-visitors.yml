name: Update visitors

on:
  schedule:
    # Every day at 03:20 UTC (after the citations/stars jobs)
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-visitors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies 📦
        run: pip install pyyaml

      - name: Fetch visitor countries 🌍
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python bin/update_visitors.py

      - name: Commit changes 💾
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update visitor countries"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy 🚀
        # GITHUB_TOKEN pushes do not trigger other workflows, so dispatch the
        # deploy explicitly when the data changed.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --repo intLyc/intLyc.github.io --ref main
