name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "requirements.txt"
      - "test/**"
      - "!README.md"
  schedule:
    # Best-effort daily rebuild (04:00 UTC = 12:00 Singapore/Beijing). The local
    # launchd job (com.intlyc.refresh) provides an independent daily trigger.
    - cron: "0 4 * * *"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "requirements.txt"
      - "test/**"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Install data refresh deps 📦
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Test dynamic data logic 🧪
        run: python3 -m unittest discover -s test -v
      - name: Refresh GitHub stars ⭐
        id: refresh_stars
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 bin/update_github_stars.py
      - name: Refresh cumulative visitors 🌍
        id: refresh_visitors
        if: github.event_name != 'pull_request'
        continue-on-error: true
        # Google Scholar citations are refreshed by the local launchd job
        # (bin/refresh_local.sh) because Scholar blocks GitHub CI IPs.
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 bin/update_visitors.py
      - name: Summarize dynamic data refresh 📋
        if: always()
        env:
          STARS_OUTCOME: ${{ steps.refresh_stars.outcome }}
          VISITORS_OUTCOME: ${{ steps.refresh_visitors.outcome }}
        run: |
          {
            echo "## Dynamic data refresh"
            echo "- GitHub stars: ${STARS_OUTCOME}"
            echo "- Cumulative visitors: ${VISITORS_OUTCOME}"
            echo ""
            echo "A failed refresh does not block deployment; validated last-known data is retained."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: npx --no-install purgecss -c purgecss.config.js
      - name: Add .nojekyll to built site 🧹
        run: touch _site/.nojekyll
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
