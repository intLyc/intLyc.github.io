name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "requirements.txt"
      - "test/**"
      - "!README.md"
  schedule:
    # Best-effort daily rebuild (04:00 UTC = 12:00 Singapore/Beijing). Citation
    # changes pushed by the local launchd job also trigger this workflow.
    - cron: "0 4 * * *"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "purgecss.config.js"
      - "requirements.txt"
      - "test/**"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Install data refresh deps 📦
        run: python3 -m pip install --quiet pyyaml==6.0.3
      - name: Test dynamic data logic 🧪
        run: python3 -m unittest discover -s test -v
      - name: Refresh GitHub stars ⭐
        id: refresh_stars
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 bin/update_github_stars.py
      - name: Refresh cumulative visitors 🌍
        id: refresh_visitors
        if: github.event_name != 'pull_request'
        continue-on-error: true
        # Google Scholar citations are refreshed by the local launchd job
        # (bin/refresh_local.sh) because Scholar blocks GitHub CI IPs.
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 bin/update_visitors.py
      - name: Validate visitor fallback snapshot 🛡️
        if: github.event_name != 'pull_request'
        run: python3 bin/update_visitors.py --validate-snapshot
      - name: Persist latest visitor snapshot 💾
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.refresh_visitors.outcome == 'success'
        run: |
          if git diff --quiet -- _data/visitors.yml; then
            echo "Visitor snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.yml
          git commit -m "chore: persist visitor snapshot [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Summarize dynamic data refresh 📋
        if: always()
        env:
          STARS_OUTCOME: ${{ steps.refresh_stars.outcome }}
          VISITORS_OUTCOME: ${{ steps.refresh_visitors.outcome }}
        run: |
          {
            echo "## Dynamic data refresh"
            echo "- GitHub stars: ${STARS_OUTCOME}"
            echo "- Cumulative visitors: ${VISITORS_OUTCOME}"
            echo ""
            echo "A failed refresh deploys the validated snapshot from the last successful refresh."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: npx --no-install purgecss -c purgecss.config.js
      - name: Add .nojekyll to built site 🧹
        run: touch _site/.nojekyll
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
